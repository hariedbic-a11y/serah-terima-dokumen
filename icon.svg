<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <!-- LOGO 1: PERMATA HUSADA SAKTI -->
  <g id="logo-phs" transform="translate(15, 10)">
    <!-- Balok Navy Huruf L -->
    <path d="M 10 25 L 50 25 L 50 85 L 95 85 L 95 130 L 10 130 Z" fill="#1b1d5c"/>
    
    <!-- Roda Cakra Biru Muda -->
    <circle cx="85" cy="45" r="38" fill="none" stroke="#005bac" stroke-width="4.5"/>
    <!-- Pusat Merah -->
    <circle cx="85" cy="45" r="10" fill="#dc2626"/>
    
    <!-- Jari-Jari Roda Cakra -->
    <line x1="85" y1="7" x2="85" y2="83" stroke="#005bac" stroke-width="3.5"/>
    <line x1="47" y1="45" x2="123" y2="45" stroke="#005bac" stroke-width="3.5"/>
    <line x1="58" y1="18" x2="112" y2="72" stroke="#005bac" stroke-width="3.5"/>
    <line x1="58" y1="72" x2="112" y2="18" stroke="#005bac" stroke-width="3.5"/>

    <!-- Teks PERMATA HUSADA SAKTI -->
    <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" fill="#1b1d5c" font-size="33" letter-spacing="1.5">
      <text x="145" y="48">PERMATA</text>
      <text x="145" y="85">HUSADA</text>
      <text x="145" y="122">SAKTI</text>
    </g>
  </g>

  <!-- GARIS PEMISAH HALUS (OPTIONAL ELEGAN) -->
  <line x1="440" y1="25" x2="440" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- LOGO 2: RUMAH SAKIT GRHA PERMATA IBU -->
  <g id="logo-rpi" transform="translate(465, 12)">
    <!-- Lingkaran Hijau Toska -->
    <circle cx="65" cy="65" r="55" fill="none" stroke="#047857" stroke-width="9"/>
    
    <!-- Siluet Ibu & Anak Menggendong -->
    <path d="M 52 35 C 64 35 73 43 73 53 C 73 63 65 68 55 71 C 48 73 43 81 43 93 L 78 93 C 82 93 85 89 85 83 C 85 66 72 50 52 35 Z" fill="#047857"/>
    <circle cx="58" cy="48" r="6.5" fill="#ffffff"/>
    <path d="M 45 77 C 52 77 58 82 58 89 L 38 89 C 38 82 41 77 45 77 Z" fill="#047857"/>

    <!-- Teks Rumah Sakit Grha PERMATA IBU -->
    <text x="135" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="20" fill="#1e293b" letter-spacing="0.5">Rumah Sakit</text>
    <text x="135" y="88" font-family="'Plus Jakarta Sans', Georgia, serif" font-weight="900" font-style="italic" font-size="31" fill="#047857" letter-spacing="0.5">Grha PERMATA IBU</text>
  </g>
</svg>
